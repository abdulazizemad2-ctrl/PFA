<style>

const LETTERS = ['أ','ب','ج','د'];
const TOPICS = [...new Set(Q.map(q=>q.t))];
const store = {
  get(k,d){try{const v=localStorage.getItem('fa_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('fa_'+k,JSON.stringify(v))}catch(e){}}
};
let flagged = new Set(store.get('flagged',[]));
let wrong = new Set(store.get('wrong',[]));
let selTopics = new Set(TOPICS);
let S = null, timerId = null;
const app = document.getElementById('app');
const h = (s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nT = Q.filter(q=>q.s==='T').length;
document.getElementById('counts').innerHTML = `<span>${Q.length} سؤالاً</span><span>${nT} من التجميعات</span><span>${Q.length-nT} جديد</span>`;

function home(){
  clearInterval(timerId); S=null;
  const tchips = TOPICS.map((t,i)=>`<button class="chip" id="tp${i}" aria-pressed="${selTopics.has(t)}" data-t="${h(t)}">${h(t)}</button>`).join('');
  app.innerHTML = `
  <h2>اختر نوع الاختبار</h2>
  <div class="modes">
    <button class="mode" id="m-full"><b>اختبار شامل</b><small>كل الأسئلة (${Q.length}) بترتيب الملخص، مع النتيجة لكل محاضرة.</small></button>
    <button class="mode" id="m-quick"><b>اختبار سريع بمؤقت</b><small>20 سؤالاً عشوائياً في 15 دقيقة.</small></button>
    <button class="mode" id="m-topic"><b>حسب الموضوع</b><small>أسئلة المحاضرات التي تختارها من القائمة تحت.</small></button>
    <button class="mode" id="m-wrong" ${wrong.size?'':'disabled'}><b>مراجعة الأخطاء</b><small>${wrong.size?`${wrong.size} سؤالاً أخطأت فيها سابقاً.`:'لا توجد أخطاء محفوظة بعد.'}</small></button>
    <button class="mode" id="m-flag" ${flagged.size?'':'disabled'}><b>الأسئلة المعلّمة</b><small>${flagged.size?`${flagged.size} سؤالاً علّمتها للمراجعة.`:'علّم أي سؤال أثناء الحل ليظهر هنا.'}</small></button>
  </div>
  <h2>المحاضرات</h2>
  <div class="topics">${tchips}</div>
  <div class="stats"><span>من التجميعات: <b>${nT}</b></span><span>جديد: <b>${Q.length-nT}</b></span></div>`;
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{const t=b.dataset.t; selTopics.has(t)?selTopics.delete(t):selTopics.add(t); if(!selTopics.size) selTopics.add(t); home();});
  const idx = Q.map((_,i)=>i);
  document.getElementById('m-full').onclick=()=>start('شامل',idx);
  document.getElementById('m-quick').onclick=()=>start('سريع',shuffle(idx).slice(0,20),15*60);
  document.getElementById('m-topic').onclick=()=>start('حسب الموضوع',idx.filter(i=>selTopics.has(Q[i].t)));
  document.getElementById('m-wrong').onclick=()=>start('مراجعة الأخطاء',idx.filter(i=>wrong.has(i)));

function start(name, list, secs){
  if(!list.length) return;
  S = {name, list, pos:0, ans:{}, secs, left:secs};
  clearInterval(timerId);
  if(secs){ timerId=setInterval(()=>{S.left--; const el=document.getElementById('timer'); if(el){el.textContent=fmt(S.left); el.classList.toggle('low',S.left<=60)} if(S.left<=0){clearInterval(timerId); result();}},1000); }
  render();
}
const fmt = s=>`${String(Math.floor(Math.max(s,0)/60)).padStart(2,'0')}:${String(Math.max(s,0)%60).padStart(2,'0')}`;

function render(){
  const i = S.list[S.pos], q = Q[i], a = S.ans[i];
  const done = Object.keys(S.ans).length;
  const opts = q.o.map((o,k)=>{
    let c=''; if(a!==undefined){ if(k===q.a) c='ok'; else if(k===a) c='bad'; }
    return `<button class="opt ${c}" id="op${k}" data-k="${k}" ${a!==undefined?'disabled':''}><span class="lt">${LETTERS[k]}</span><span>${h(o)}</span></button>`;
  }).join('');
  const fb = a===undefined?'':(a===q.a?`<div class="fb ok">إجابة صحيحة.</div>`:`<div class="fb bad">إجابة خاطئة، الصحيحة: (${LETTERS[q.a]}) ${h(q.o[q.a])}</div>`);
  app.innerHTML = `
  <div class="bar"><span class="meta">${h(S.name)} · السؤال ${S.pos+1} من ${S.list.length} · أُجيب ${done}</span>${S.secs?`<span class="timer" id="timer">${fmt(S.left)}</span>`:''}</div>
  <div class="prog"><i style="width:${(done/S.list.length)*100}%"></i></div>
  <div class="card">
    <div class="qhead"><span class="qnum">${i+1}</span><span class="qtext"><span class="topic">${h(q.t)}</span>${h(q.q)}</span><span class="tag ${q.s}">${q.s==='T'?'تجميعات':'جديد'}</span></div>
    <div class="opts">${opts}</div>${fb}
  </div>
  <div class="actions">
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" id="prev" ${S.pos?'':'disabled'}>السابق</button>
      <button class="btn" id="next">${S.pos===S.list.length-1?'إنهاء وعرض النتيجة':'التالي'}</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost flag" id="flag" aria-pressed="${flagged.has(i)}">${flagged.has(i)?'معلّم للمراجعة':'علّم للمراجعة'}</button>
      <button class="btn ghost" id="quit">إنهاء</button>
    </div>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    const k=+b.dataset.k; S.ans[i]=k;
    if(k===q.a) wrong.delete(i); else wrong.add(i);
    store.set('wrong',[...wrong]); render();
  });
  document.getElementById('prev').onclick=()=>{S.pos--;render()};
  document.getElementById('next').onclick=()=>{ if(S.pos===S.list.length-1) result(); else {S.pos++;render()} };
  document.getElementById('flag').onclick=()=>{flagged.has(i)?flagged.delete(i):flagged.add(i); store.set('flagged',[...flagged]); render()};
  document.getElementById('quit').onclick=result;
}

function result(){
  clearInterval(timerId);
  const L = S.list; let ok=0, ans=0; const per={};
  L.forEach(i=>{const t=Q[i].t; per[t]=per[t]||{ok:0,n:0}; per[t].n++; if(S.ans[i]!==undefined){ans++; if(S.ans[i]===Q[i].a){ok++; per[t].ok++}}});
  const pct = Math.round(ok/L.length*100);
  const rows = Object.entries(per).map(([t,v])=>{const p=Math.round(v.ok/v.n*100); const col=p>=80?'var(--ok)':p>=50?'var(--flag)':'var(--bad)';
    return `<div class="row"><div class="top"><span>${h(t)}</span><span>${v.ok} من ${v.n}</span></div><div class="meter"><i style="width:${p}%;background:${col}"></i></div></div>`}).join('');
  const missed = L.filter(i=>S.ans[i]!==Q[i].a);
  const list = missed.length? missed.map(i=>`<div class="row"><div style="font-weight:700">${i+1}. ${h(Q[i].q)}</div><div style="margin-top:4px">الصحيحة: <b>(${LETTERS[Q[i].a]}) ${h(Q[i].o[Q[i].a])}</b>${S.ans[i]!==undefined?` · إجابتك: (${LETTERS[S.ans[i]]}) ${h(Q[i].o[S.ans[i]])}`:' · لم تُجب'}</div></div>`).join('') : `<div class="empty">لا توجد أخطاء في هذه المحاولة.</div>`;
  app.innerHTML = `
  <div class="score"><div class="big">${pct}%</div><div><b>${ok} صحيحة من ${L.length}</b><div class="stats"><span>أُجيب: <b>${ans}</b></span><span>لم يُجب: <b>${L.length-ans}</b></span>${S.secs?`<span>الوقت المتبقي: <b>${fmt(S.left)}</b></span>`:''}</div></div></div>
  <h2>النتيجة لكل محاضرة</h2><div class="rows">${rows}</div>
  <h2>الأسئلة التي تحتاج مراجعة</h2><div class="rows">${list}</div>
